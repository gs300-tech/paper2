<script>
var T=[
{id:"em",d:1,m:[["The 44th Amendment replaced “internal disturbance” with:",["Armed rebellion","Civil war","Economic crisis","Political instability"],0,"After the 1975 experience, the vague ground was replaced by “armed rebellion”."],["Which rights can never be suspended during an emergency?",["Arts. 14 and 19","Arts. 20 and 21","Arts. 21 and 32","Arts. 19 and 21"],1,"After the 44th Amendment, Arts. 20 and 21 stay protected even under Art. 359."],["President’s Rule can run beyond one year only if:",["The Supreme Court permits","Rajya Sabha passes a two-thirds resolution","A national emergency is in force and the Election Commission certifies elections are difficult","The Governor consents"],2,"Both conditions in the 44th Amendment must be met."]],t:"Emergency",q:"Art. 352 and its effects; President’s Rule (Art. 356); Financial Emergency (Art. 360).",p:[
["1. What is an emergency, and why does the Constitution have it?","Normally India works as a federation: the Centre and the States each have their own areas of power. But a war, or the collapse of government in a State, can paralyse that arrangement. Part XVIII (Arts. 352 to 360) lets the Centre temporarily take stronger control so the country can respond quickly. There are three kinds: National Emergency (Art. 352), failure of constitutional machinery in a State, also called President’s Rule (Art. 356), and Financial Emergency (Art. 360).","Picture a house where every family member runs their own room. When there is a fire, one person takes charge of everyone until the danger passes.","Start every emergency answer by naming the three types. It earns the introduction marks."],
["2. When can a National Emergency be declared? (Art. 352)","Only if the security of India or any part of it is threatened by war, external aggression or armed rebellion. Before 1978 the ground was “internal disturbance”, a vague phrase, and in 1975 it was used during a political crisis. The 44th Amendment replaced it with the narrower “armed rebellion” and required the written advice of the Cabinet, so the Prime Minister alone cannot trigger it.","The 44th Amendment is a lesson learned: after 1975 the rules were rewritten so that one person could not misuse the power again.","Mention 1975 and the 44th Amendment. It shows you understand why the safeguards exist."],
["3. How does Parliament keep control?","The declaration does not stand on the President’s word alone. Parliament must approve it within one month by a special majority (a majority of total membership and two-thirds of members present and voting). It then lasts six months and must be renewed every six months. If the Lok Sabha passes a resolution against it by simple majority, it must be revoked, and one-tenth of Lok Sabha members can force a special sitting to debate that.","It works like a temporary permit that must be renewed regularly and can be cancelled by the House.","Remember three numbers: one month, two-thirds, six months."],
["4. What changes while it is in force? (Arts. 353, 250, 83(2), 354)","India starts behaving like a unitary State. The Union can give binding directions to the States on how to use their executive power (Art. 353). Parliament can make laws on State List subjects (Art. 250). The life of the Lok Sabha can be extended by one year at a time (Art. 83(2)). The President can modify how tax revenue is shared between the Union and the States (Art. 354).","Imagine the head of a school giving direct orders to class monitors who normally decide things themselves.","Write these as headings: executive, legislative, financial. Then add Fundamental Rights as the fourth."],
["5. What happens to Fundamental Rights? (Arts. 358 and 359)","Art. 358: if the emergency is on the ground of war or external aggression, the freedoms in Art. 19 (speech, assembly, movement and so on) are suspended automatically and revive when it ends. Art. 359: the President may by order suspend your right to go to court to enforce specified rights. After the 44th Amendment, Arts. 20 (protection against unfair conviction) and 21 (life and personal liberty) can never be suspended. The right itself survives; only the remedy in court is frozen.","Art. 358 is a switch that flips by itself. Art. 359 is a switch the President must flip by signing an order.","Comparison is a favourite short note: automatic vs by order; only Art. 19 vs any right except Arts. 20 and 21; war or external aggression only vs any emergency."],
["6. President’s Rule (Art. 356)","If a State government cannot run according to the Constitution (for example, nobody can form a government, or the State defies Union directions under Art. 365), the President, on the Governor’s report or otherwise, can take over the State. The Assembly is suspended or dissolved and Parliament makes laws for the State. Parliament must approve within two months by simple majority. It lasts six months, extendable to a maximum of three years, but beyond one year only if a national emergency is in force and the Election Commission certifies that elections cannot be held. The High Court keeps working normally.","It is like a school board removing a failed management and appointing an administrator until a new one is chosen.","Use the phrase “failure of constitutional machinery” and link it to Art. 365."],
["7. S.R. Bommai v. Union of India (1994): the case that tamed Art. 356","Before Bommai, President’s Rule was often used against opposition-ruled States, and courts stayed out. The Supreme Court held: (1) the proclamation can be reviewed, and the Union must show its material; (2) the Assembly must not be dissolved until Parliament approves, so it stays in suspended animation; (3) whether a government has a majority is tested on the floor of the House, not by the Governor’s opinion; (4) secularism is part of the basic structure, so a State acting against it can attract Art. 356; (5) federalism is also basic structure, so the power must be used rarely.","Bommai turned Art. 356 from a blank cheque into a power that needs a receipt.","Cite Bommai with at least three of the five points. Add Rameshwar Prasad (2006) if you remember it."],
["8. Financial Emergency (Art. 360) and judicial review","If the financial stability or credit of India is threatened, the President can declare it. Parliament must approve within two months, and there is no time limit. The Union can then direct States to follow financial discipline, reduce the salaries of government servants including Supreme Court and High Court judges, and require State money Bills to be sent to the President. It has never been declared. On review: in Minerva Mills (1980) the Court said an emergency proclamation can be examined if it is mala fide or based on irrelevant grounds. ADM Jabalpur (1976), which denied habeas corpus during the emergency, was later declared wrong in Puttaswamy (2017).","It is like an austerity plan when a household is close to bankruptcy.","Mention that judges’ salaries can be reduced. Examiners look for this point."]]},
{id:"am",d:1,m:[["Which case says Parliament can amend any part but not the basic structure?",["Golak Nath","Shankari Prasad","Kesavananda Bharati","Sajjan Singh"],2,"Kesavananda Bharati (1973) overruled Golak Nath and created the basic structure doctrine."],["Which clauses did Minerva Mills strike down?",["Art. 13(4)","Art. 368(4) and (5)","Art. 31C","Art. 368(1)"],1,"They tried to make Parliament’s amending power unlimited and beyond judicial review."],["An amendment touching federal features needs ratification by:",["All States","Half of the State legislatures","Two-thirds of the States","Only the Rajya Sabha"],1,"Art. 368(2) proviso requires ratification by at least half of the State legislatures."]],t:"Amendment",q:"Art. 368 procedure; extent of power; can Parliament repeal the Constitution?",p:[
["1. Why does Art. 368 exist?","A Constitution must change with the times, but it must also protect its core values from every passing majority. So Art. 368 lets Parliament amend the Constitution through a harder procedure than ordinary law. India’s Constitution is therefore a blend of rigid and flexible: some parts change easily, others need a demanding process.","You can renovate the rooms of a house, but you cannot remove its foundation.","Open your answer with “blend of rigidity and flexibility”."],
["2. The procedure, step by step","(1) A Bill is introduced only in Parliament, never in a State legislature, and no prior permission of the President is needed. (2) Each House passes it by a special majority: a majority of its total membership and two-thirds of members present and voting. (3) There is no joint sitting if the Houses disagree. (4) If the change touches federal matters (election of the President, Supreme Court and High Courts, Seventh Schedule, representation of States in Parliament, Art. 368 itself), at least half of the State legislatures must ratify it. (5) The President must give assent (24th Amendment, 1971). Some changes, such as creating new States, need only a simple majority and sit outside Art. 368.","Ordinary law has one lock. An amendment adds a second lock. Federal matters add a third, held by the States.","Write the procedure as five numbered steps."],
["3. The big fight: can Parliament amend Fundamental Rights?","1951 Shankari Prasad and 1965 Sajjan Singh: yes, an amendment is not “law” under Art. 13(2). 1967 Golak Nath: no, an amendment is “law”, so it cannot take away rights. Parliament answered with the 24th Amendment (1971), which said Art. 13 does not apply to constitutional amendments. 1973 Kesavananda Bharati (13 judges, 7:6): Parliament can amend any provision, even Fundamental Rights, but cannot alter the basic structure.","This was a tug of war between Parliament and the Court. Kesavananda is the compromise that still stands.","Present these as a short timeline. It shows you understand how the law developed."],
["4. What is the basic structure?","The Court never gave a complete list; it identifies features case by case. Examples: supremacy of the Constitution, rule of law, separation of powers, judicial review, federalism, secularism, democratic republic, free and fair elections, independence of the judiciary, harmony between Fundamental Rights and Directive Principles. An amendment that destroys any of these is void, however big the majority behind it.","Think of the Constitution as a building. Parliament may change the interiors but cannot remove the pillars.","Name at least five features and always tie the doctrine to Kesavananda."],
["5. The 42nd Amendment strikes back, and Minerva Mills answers","In the 1975 emergency the 42nd Amendment added Art. 368(4) and (5): no court could question an amendment, and Parliament’s power was unlimited. In Minerva Mills (1980) the Court struck down both clauses, saying a limited power cannot make itself unlimited, because that would destroy the basic structure. Later, Waman Rao (1981) fixed 24 April 1973 as the date from which the doctrine applies, and I.R. Coelho (2007) held that Ninth Schedule laws made after that date are open to review.","A person given limited authority cannot write a letter giving himself unlimited authority.","Use this as the conclusion: the Court is the guardian of the Constitution."],
["6. Can Parliament repeal the Constitution under Art. 368?","No. The power to amend is not the power to destroy. Parliament can add, change or repeal particular provisions, but it cannot abrogate the Constitution, replace it with a new one, or damage its basic structure. Only the people, acting through a Constituent Assembly, could make a new Constitution. After Kesavananda and Minerva Mills, any amendment that crosses this line is void.","You can repaint, rebuild and redesign a house. You cannot demolish it and call that renovation.","Say “No” in the first line, then explain."]]},
{id:"pr",d:1,m:[["The President is elected by:",["Direct vote of the people","Elected MPs and MLAs by single transferable vote","All MPs only","Lok Sabha alone"],1,"It is an indirect election by an electoral college under proportional representation."],["The ground for impeaching the President is:",["Misbehaviour","Incapacity","Violation of the Constitution","Loss of majority"],2,"Art. 61 allows impeachment only for violation of the Constitution."],["An ordinance under Art. 123 ceases:",["After 3 months","Six weeks after Parliament reassembles","On the next day","After one year"],1,"It also ceases earlier if both Houses disapprove it."]],t:"President",q:"Election, qualifications, impeachment, powers, ordinance, position after the 42nd and 44th Amendments.",p:[
["1. The President’s role in one picture","India follows the parliamentary system. The President is the head of State, while the Prime Minister and the Council of Ministers are the real government. Art. 53 vests all Union executive power in the President, but in practice it is exercised on the advice of the Council of Ministers.","The President is like a company chairman who signs the formal documents, while the managing director takes the decisions.","State this in your first two lines."],
["2. How the President is elected (Arts. 54 and 55)","The election is indirect. The electoral college has the elected members of both Houses of Parliament and of the State Legislative Assemblies (including Delhi and Puducherry). Nominated members and Legislative Council members do not vote. Voting is by proportional representation using the single transferable vote, by secret ballot. Because States differ in population, an MLA’s vote value is State population divided by (1000 times the number of elected MLAs), and the total value of all MPs’ votes is made equal to the total of all MLAs’ votes, so the Union and the States carry equal weight. A candidate needs more than half of the valid votes. Disputes go directly to the Supreme Court (Art. 71).","It is weighted voting: a large State’s MLA and a small State’s MLA count in proportion to the populations they represent.","Write the MLA vote value formula in one line. Examiners notice it."],
["3. Qualifications and term (Arts. 56 to 62)","He must be a citizen, at least 35 years old, qualified to be elected to the Lok Sabha, and not hold an office of profit. The term is five years and he can be re-elected. He continues until his successor takes charge. The oath is taken before the Chief Justice of India. He resigns by writing to the Vice-President, and a vacancy must be filled within six months.","These are simple facts, so treat them as free marks.","Learn the three numbers: 35, 5 years, 6 months."],
["4. Impeachment (Art. 61)","The only ground is violation of the Constitution. A resolution can start in either House, signed by at least one-fourth of its members, with 14 days’ notice to the President. It must be passed by two-thirds of the total membership of that House. The other House then investigates the charge, and the President may appear and be represented. If that House also passes the resolution by two-thirds of its total membership, he is removed from that date. No President has been impeached so far.","It works like a trial where one House brings the charge and the other House acts as the judge.","Always write “violation of the Constitution” as the ground."],
["5. Powers of the President","Executive: appoints the Prime Minister, Governors, judges, the Attorney General, CAG, Chief Election Commissioner; supreme commander of the armed forces. Legislative: summons, prorogues, dissolves the Lok Sabha; addresses Parliament; nominates 12 members to the Rajya Sabha; assents to Bills. Financial: no money Bill without his recommendation. Judicial: pardon, reprieve, remission and commutation (Art. 72). Emergency: Arts. 352, 356, 360. Veto: for an ordinary Bill he can assent, withhold assent, or return it once; if Parliament passes it again, he must assent. There is no time limit, so he can simply sit on a Bill (a pocket veto).","A pocket veto means the Bill is “put in the pocket” and never decided.","Group the powers under five headings and explain the veto in one sentence each."],
["6. The ordinance power (Art. 123)","When Parliament is not in session and immediate action is necessary, the President can issue an ordinance with the same force as an Act. It must be laid before Parliament and ceases six weeks after Parliament reassembles, or earlier if both Houses disapprove it. It cannot amend the Constitution. Cases: R.C. Cooper (1970), the President’s satisfaction can be challenged if mala fide; D.C. Wadhwa v. State of Bihar (1987), repeatedly re-issuing ordinances is a fraud on the Constitution; Krishna Kumar Singh (2017) followed this.","An ordinance is a temporary law for when Parliament is on holiday. It cannot become a way around Parliament.","Mention Wadhwa. It is the most quoted case on this topic."],
["7. Is the President free to act on his own? (Art. 74, 42nd and 44th Amendments)","Art. 74(1) says the Council of Ministers, headed by the Prime Minister, aids and advises the President. The 42nd Amendment (1976) added “shall act in accordance with such advice”, making it binding. The 44th Amendment (1978) allowed the President to ask the Council to reconsider its advice once, but he must then act on the advice given after reconsideration. Art. 74(2) bars courts from asking what advice was given. Shamsher Singh (1974) and Ram Jawaya Kapur (1955) confirm the President is a constitutional head. His real discretion lies in choosing a Prime Minister when no party has a majority, returning a Bill, the pocket veto, and asking for reconsideration.","Reconsideration is a request to think again. It is not a veto.","Finish with: the President is the nominal head, and the Council of Ministers is the real executive."]]},
{id:"go",d:1,m:[["The Governor’s oath is administered by:",["The President","Chief Minister","Chief Justice of the High Court","Speaker"],2,"Art. 159: the oath is taken before the Chief Justice of the High Court."],["The Governor cannot grant pardon for:",["Life imprisonment","A death sentence","Fines","Short sentences"],1,"Under Art. 161 he cannot pardon a death sentence."],["Which case limited the Governor’s discretion to summon the Assembly?",["Nabam Rebia (2016)","Bommai (1994)","Wadhwa (1987)","Golak Nath (1967)"],0,"Nabam Rebia held that he must generally act on ministerial advice."]],t:"Governor",q:"Appointment, powers, ordinance, position with the Council of Ministers.",p:[
["1. Who is the Governor and what is his job?","The Governor is the constitutional head of a State, just as the President is for the Union. Art. 153 provides a Governor for each State, and Art. 154 vests the State’s executive power in him. In practice the elected State government runs the State and the Governor acts as its formal head. He is also the link between the Centre and the State, because he is appointed by the Union. One person may be Governor of two or more States.","Think of him as the formal head of the State and the Centre’s eyes and ears inside it.","Open with: constitutional head of the State and link between Union and State."],
["2. Appointment, qualifications and tenure (Arts. 155 to 159)","The Governor is not elected. He is appointed by the President by warrant under his hand and seal, so in effect by the Union government. Qualifications: a citizen of India, at least 35 years old (Art. 157). He must not be a member of Parliament or a State Legislature, and must not hold any office of profit (Art. 158). The normal term is five years, but he holds office during the pleasure of the President (Art. 156). In B.P. Singhal v. Union of India (2010) the Supreme Court held that this pleasure is not arbitrary: a Governor cannot be removed merely because the government at the Centre changed, and there must be compelling reasons. The oath is taken before the Chief Justice of the High Court (Art. 159).","“Pleasure of the President” sounds absolute, but Singhal turned it into a power that needs a good reason.","Mention B.P. Singhal. It shows you know the limit on removal."],
["3. Powers of the Governor","Executive: appoints the Chief Minister and, on the Chief Minister’s advice, other ministers (Art. 164); appoints the Advocate General (Art. 165); acts through the Council of Ministers (Art. 163). Legislative: summons, prorogues and dissolves the Assembly (Art. 174); addresses the Legislature (Art. 176); nominates members to the Legislative Council (Art. 171); assents to Bills, withholds assent, returns an ordinary Bill, or reserves it for the President (Arts. 200 and 201). Financial: a money Bill can be introduced only with his recommendation (Art. 207), and the Contingency Fund of the State is at his disposal. Judicial: he can grant pardons, suspensions and commutations for offences under State law, but he cannot pardon a death sentence (Art. 161).","The Governor’s powers mirror the President’s, but at State level and with one big difference: no power over death sentences.","Use the four headings: executive, legislative, financial, judicial."],
["4. Discretionary powers (Art. 163)","Art. 163(1) says the Council of Ministers aids and advises the Governor, “except in so far as he is required to exercise his functions in his discretion”. Art. 163(2) says that if a question arises whether something is in his discretion, his decision is final. Typical discretionary situations: choosing a Chief Minister when no party has a clear majority; reserving a Bill for the President; sending a report recommending President’s Rule under Art. 356; and special responsibilities under the Sixth Schedule for tribal areas in Assam, Meghalaya, Tripura and Mizoram. In Nabam Rebia v. Deputy Speaker (2016) the Court held that his discretion in summoning or dissolving the Assembly is limited and cannot go against the advice of the Council.","His discretion is a small reserved area. Outside it, he follows his ministers.","Give three situations of discretion and cite Nabam Rebia."],
["5. Ordinance-making power (Art. 213)","When the Legislature is not in session and immediate action is necessary, the Governor can promulgate an ordinance with the force of a State law. It must be laid before the Legislature and ceases six weeks after the Legislature reassembles, or earlier if it is disapproved. He cannot issue an ordinance on a matter where a Bill would need the President’s previous sanction or reservation, unless he first obtains the President’s instructions. The same safeguards against misuse apply as for the President’s ordinance: D.C. Wadhwa v. State of Bihar (1987), repeatedly re-promulgating ordinances is a fraud on the Constitution.","It is the State’s emergency law-making tool for the time when the Legislature is not sitting.","Compare it in one line with Art. 123, as the structure is the same."],
["6. Position and relationship with the Council of Ministers","In Shamsher Singh v. State of Punjab (1974) the Supreme Court held that the President and the Governor are formal heads who exercise their powers on the advice of the Council of Ministers, except in a few special situations. So the Chief Minister and his Council are the real executive and the Governor is the constitutional head. The Governor’s reports to the President under Art. 356 are open to judicial review, as shown in S.R. Bommai (1994) and Rameshwar Prasad (2006).","A bridge between two governments, not a rival to the State government.","Finish with: the Governor is the constitutional head, not a parallel authority."]]},
{id:"wr",d:1,t:"Writs",q:"Writs under Arts. 32 and 226; short notes on each writ.",m:[["Which writ means “you may have the body”?",["Mandamus","Habeas Corpus","Certiorari","Quo Warranto"],1,"Habeas Corpus orders that a detained person be produced before the court, to test whether the detention is lawful."],["Which writ tests a person’s claim to a public office?",["Quo Warranto","Prohibition","Mandamus","Certiorari"],0,"Quo Warranto means “by what authority”. Any person, not only an aggrieved one, can apply."],["Which writ is preventive and issued while proceedings are still pending?",["Certiorari","Habeas Corpus","Prohibition","Mandamus"],2,"Prohibition stops a lower body from exceeding jurisdiction. Certiorari acts afterwards and quashes the order."]],p:[
["1. Art. 32 versus Art. 226: why two routes?","Art. 32 is itself a Fundamental Right: any person whose Fundamental Right is violated can go straight to the Supreme Court, which can issue directions, orders or writs. Dr. Ambedkar called it the heart and soul of the Constitution. Art. 226 gives the High Courts the same power, but wider: they can issue writs for Fundamental Rights and also for “any other purpose”, meaning ordinary legal rights. The Supreme Court cannot refuse relief for a proved violation under Art. 32, while a High Court has discretion under Art. 226. In L. Chandra Kumar (1997) the Court held that review under both articles is part of the basic structure.","Art. 32 is the national highway for rights, Art. 226 is the wider state road network that also reaches ordinary legal disputes.","Write a three-line comparison: nature, scope, court. Then name the five writs."],
["2. Habeas Corpus: freedom from illegal detention","The Latin words mean “you may have the body”. The court orders the person holding the detainee to bring him before the court and justify the detention. If the reason is not lawful, he is freed. The detained person or anyone on his behalf can apply, and it works against the State and private persons. It will not issue where a competent court has ordered the detention after trial or for contempt. Cases: Kanu Sanyal (1973), actual production is not essential; Rudul Shah (1983), compensation for illegal detention; ADM Jabalpur (1976), denied during the emergency and later declared wrong in Puttaswamy (2017).","It is the court asking the jailer: show me the person and show me your authority.","Mention that anyone can file on the detainee’s behalf. It shows you know the relaxed standing rule."],
["3. Mandamus: forcing a public duty","Mandamus means “we command”. It is issued to a public official, authority, inferior court or tribunal that has failed to perform a public duty. Three conditions must be met: the petitioner has a legal right, the respondent has a public legal duty, and the petitioner demanded performance and was refused. It generally does not lie against private persons, against the President or a Governor personally (Art. 361), or where the duty is purely discretionary or contractual.","A citizen asks a clerk to issue a licence the law says he must issue. The clerk refuses. Mandamus is the court telling the clerk to do his job.","List the three conditions as numbered points."],
["4. Prohibition and Certiorari: the twin writs","Both control courts and tribunals that go beyond their powers. Prohibition (“to forbid”) is issued by a higher court to stop a lower court or tribunal from exceeding jurisdiction or violating natural justice, so it is preventive and works while proceedings are pending. Certiorari (“to be certified”) is issued after the decision to quash an order made without jurisdiction, in excess of it, with an error of law apparent on its face, or against natural justice, so it is corrective. A.K. Kraipak (1969) extended both beyond strictly judicial bodies to administrative authorities that must follow natural justice.","Prohibition is a stop sign before the mistake. Certiorari is the eraser after it.","The standard comparison: before the order (prohibition) versus after the order (certiorari)."],
["5. Quo Warranto: challenging a usurper","Quo warranto means “by what authority”. The court asks a person holding a public office to show the legal basis of his claim. The office must be public, created by the Constitution or a statute, and substantive. It protects the public from usurpers, so any person, not only someone personally hurt, can apply. Case: University of Mysore v. C.D. Govinda Rao (1964).","It is like asking a stranger sitting in the manager’s chair: who gave you this post?","Mention that the applicant need not be aggrieved. That is the distinguishing feature."]]},
{id:"ju",d:1,t:"Judiciary",q:"Supreme Court and High Court jurisdiction, appointment, NJAC, independence, judicial review and activism.",m:[["Which case created the collegium system?",["S.P. Gupta (1981)","Advocates-on-Record Association (1993)","Kesavananda Bharati (1973)","NJAC case (2015)"],1,"The Second Judges Case (1993) overruled S.P. Gupta and gave the CJI’s opinion primacy through a collegium."],["Under Art. 143(1), the Supreme Court’s advisory opinion is:",["Binding on the President","Binding on Parliament","Not binding, the Court may decline","Final and non-reviewable"],2,"Under Art. 143(1) the Court “may” give an opinion, and it is not binding."],["Judges of the Supreme Court are removed by:",["The CJI alone","Address of both Houses by special majority, then the President","Collegium decision","Simple majority in the Lok Sabha"],1,"Art. 124(4): proved misbehaviour or incapacity, with an address by both Houses passed by special majority in the same session."]],p:[
["1. Supreme Court: composition, qualifications and removal (Art. 124)","The Supreme Court has the Chief Justice of India and other judges, the number fixed by Parliament (currently 33 plus the CJI). A person is qualified if he has been a High Court judge for at least five years, an advocate of a High Court for at least ten years, or in the President’s opinion a distinguished jurist. Judges retire at 65. Removal is deliberately difficult: only for proved misbehaviour or incapacity, through a motion signed by 100 Lok Sabha or 50 Rajya Sabha members, an inquiry by a three-member committee under the Judges (Inquiry) Act, 1968, and an address passed by each House by a majority of total membership and two-thirds of members present and voting. After retirement a judge cannot practise before any court in India (Art. 124(7)).","Removal is like a three-key vault: a committee, Parliament’s two Houses, and the President.","Mention that no judge has been removed so far."],
["2. Supreme Court jurisdiction: original, appellate, advisory","Original (Art. 131): disputes between the Union and States or between States, where a legal right depends on the question. It is exclusive. Art. 32 writs are a separate original power. Appellate: constitutional matters (Art. 132), civil matters on a High Court certificate (Art. 133), criminal matters, for example where the High Court reversed an acquittal and awarded death (Art. 134), and special leave (Art. 136), a discretionary power to hear an appeal against any court or tribunal order. Advisory (Art. 143): the President can refer a question of public importance. Under Art. 143(1) the Court “may” answer; under Art. 143(2) (certain pre-Constitution disputes) it “shall”. Opinions are not binding. Art. 141 makes the law declared by the Court binding on all courts, and Art. 142 allows orders needed for complete justice.","Original is the court as the first stop, appellate is the court of last appeal, advisory is the court acting as the government’s legal counsellor.","Write the three jurisdictions as headings and give article numbers."],
["3. How judges are appointed: the four Judges Cases","S.P. Gupta (1981): “consultation” with the CJI does not mean “concurrence”, so the executive had the upper hand. Advocates-on-Record Association (1993): overruled that, the CJI’s opinion has primacy, formed with the two senior-most judges (the collegium). Special Reference (1998): the collegium became the CJI and four senior-most judges. Advocates-on-Record Association (2015): the 99th Amendment and the NJAC Act were struck down. The NJAC had six members: the CJI, two senior-most Supreme Court judges, the Law Minister, and two eminent persons. Because the executive members could block a recommendation, the Court held it undermined judicial independence, a basic feature, and the collegium returned.","The story is a tug of war over who picks judges: executive, then judges, then Parliament tried again, then judges won again.","Present the four cases as a timeline and give the NJAC composition. It is asked directly in your question bank."],
["4. High Courts: appointment, jurisdiction, transfer","Each High Court has a Chief Justice and other judges (Art. 216). Judges are appointed by the President after consultation with the CJI, the Governor and the High Court Chief Justice (Art. 217), in practice through the collegium. A judge must be a citizen who has held judicial office for ten years or been a High Court advocate for ten years. Retirement is at 62. Jurisdiction: writ (Art. 226), supervisory over all subordinate courts and tribunals (Art. 227), original in some High Courts, and appellate. It is a Court of Record (Art. 215). The President can transfer a judge after consulting the CJI (Art. 222). In Sankalchand Sheth (1977) the Court held that transfer must be in the public interest and not a punishment.","Art. 227 is the High Court’s supervisory eye over every court in the State.","“Can judges be transferred?” Yes, Art. 222, with Sankalchand as the safeguard case."],
["5. Independence of the judiciary","Democracy needs judges who can rule against the government without fear. The Constitution protects them through: security of tenure (removal only by the special procedure); salaries charged on the Consolidated Fund and not reducible during tenure, except in a financial emergency; no discussion in Parliament of a judge’s conduct (Art. 121); no practice after retirement; power to punish contempt; control over their own staff (Art. 146); separation of the judiciary from the executive (Art. 50); and, since 1993, appointments led by the judiciary.","Independence is armour that protects the judge from pressure by the people he must be able to rule against.","Give at least five safeguards with article numbers."],
["6. Judicial review: the Court as guardian","Judicial review is the power of courts to test laws and executive acts against the Constitution and declare them void if they conflict. The basis lies in Arts. 13, 32, 131 to 136, 226 and 227. Key cases: Kesavananda Bharati (basic structure), Minerva Mills, L. Chandra Kumar (review is basic structure), I.R. Coelho (Ninth Schedule laws are reviewable), Maneka Gandhi (procedure under Art. 21 must be fair), Kihoto Hollohan (Speaker’s decisions under the Tenth Schedule are reviewable). Courts avoid political questions and respect Art. 74(2) and legislative privileges.","Parliament and the government are the players. The courts are the umpires who say when a rule has been broken.","Always link judicial review to the basic structure."],
["7. Judicial activism, overreach, restraint and PIL","Judicial activism means courts actively protect rights and fill gaps left by the legislature and the executive. The main tool is the Public Interest Litigation, where relaxed standing lets any public-spirited person approach the court for those who cannot. Landmarks: S.P. Gupta (1981) on standing; Hussainara Khatoon (1979) on speedy trial and free legal aid; Olga Tellis (1985) on right to livelihood; Vishaka (1997) on sexual harassment guidelines; M.C. Mehta (1987) on absolute liability. Judicial overreach is when courts go beyond interpretation and effectively make policy, which can breach separation of powers. Judicial restraint is the opposite: deferring to the legislature on policy.","Activism is a doctor treating a patient who cannot visit the clinic. Overreach is the doctor taking over the hospital.","Give the three terms and two PIL cases. End with “activism within constitutional limits”."]]},
{id:"us",d:1,m:[["Residuary legislative power lies with:",["States","Parliament","President","Inter-State Council"],1,"Art. 248 gives it to Parliament."],["If a State law on a Concurrent subject conflicts with a Union law:",["State law prevails","Union law prevails","Both void","The President decides"],1,"Under Art. 254, unless the State law received presidential assent."],["Art. 249 lets Parliament legislate on a State subject after a Rajya Sabha resolution passed by:",["Simple majority","Two-thirds of members present and voting","Three-fourths of total members","Half of the States"],1,"It must be in the national interest."]],t:"Union-State",q:"Distribution of legislative powers; the three lists; Centre’s directions to States.",p:[
["1. The big picture: federalism with a strong Centre","India is called a federation with a strong unitary bias. Power is shared between the Union and the States in three areas: legislative (Arts. 245 to 255), administrative (Arts. 256 to 263) and financial (Arts. 268 to 293). The Constitution makers wanted States to have real powers, but also wanted a strong Centre to protect unity, especially in an emergency. That is why the Union has more subjects, residuary power, and the power to give directions.","Think of a joint family where each branch runs its own household, but the senior member has the final say in a crisis.","Start with “federal in form, unitary in spirit”."],
["2. Legislative relations: the three lists (Arts. 245 and 246)","Art. 245 says Parliament can legislate for the whole or any part of India, and a State Legislature for its own State. Art. 246 and the Seventh Schedule divide subjects. Union List: only Parliament, for example defence, foreign affairs, atomic energy, railways, currency and banking, income tax other than agricultural. State List: only the State, for example police, public order, public health, agriculture, land, local government. Concurrent List: both, for example criminal law and procedure, civil procedure, marriage and divorce, contracts, forests, education, electricity, trade unions. If they clash on the Concurrent List, the Union law wins. Residuary power belongs to Parliament (Art. 248). Art. 246A lets both Parliament and States make laws on goods and services tax.","Three lists: yours, mine and ours. In “ours”, the Centre wins arguments.","Write two examples from each list. It shows you know the content."],
["3. Settling conflicts: doctrines and repugnancy (Art. 254)","Subjects overlap in real life, so courts use tools. Pith and substance: look at the true nature of the law; if it mainly falls in the legislature’s list, it is valid even if it touches another list slightly (State of Bombay v. F.N. Balsara, 1951). Colourable legislation: a legislature cannot do indirectly what it cannot do directly. Harmonious construction: read the lists so that entries do not cancel each other. Repugnancy (Art. 254): if a State law on a Concurrent subject conflicts with a Union law, the Union law prevails and the State law is void to the extent of the conflict. Exception: if the State law was reserved for the President and received his assent, it prevails in that State, though Parliament can later override it.","Pith and substance is judging a book by its main theme, not by one stray chapter.","Define each doctrine in one line, then give the Art. 254 exception."],
["4. When Parliament can legislate on State subjects","Normally Parliament stays out of the State List, but there are five exceptions. (1) National interest: if the Rajya Sabha passes a resolution by two-thirds of members present and voting (Art. 249). (2) During a national emergency (Art. 250). (3) With the consent of two or more States, which can be extended to others later (Art. 252). (4) To implement international treaties and agreements (Art. 253). (5) When President’s Rule is in force in a State (Art. 356).","Each exception is a door through which the Centre can step into the State’s room, and each has a special key.","Write the five exceptions as a numbered list with article numbers."],
["5. Administrative relations and the Centre’s directions","Art. 256 says every State must use its executive power so as to ensure compliance with Union laws, and the Union can give the necessary directions. Art. 257 says a State must not impede the Union’s executive power, and the Union can direct on communication lines of national importance and the protection of railways. Other directions: Arts. 339(2), 350A, 353(a), 360(3) and 365, which says that failure to comply with Union directions can lead to a finding that constitutional machinery has failed (President’s Rule). Cooperation provisions: Union can entrust functions to States (Art. 258), full faith and credit (Art. 261), inter-State water disputes (Art. 262), Inter-State Council (Art. 263), All-India Services (Art. 312), and the Union’s duty to protect States (Art. 355).","The Centre can instruct, and if a State refuses, the ultimate consequence is Art. 356.","For Q.55 (powers to give directions), list these articles with one phrase each."],
["6. Financial relations and the judicial view","Taxes fall into groups: Union taxes kept by the Union; taxes levied by the Union but collected and kept by States (Art. 268); taxes collected by the Union and assigned to States (Art. 269); and shared taxes such as income tax (Art. 270). The Finance Commission (Art. 280), set up every five years, recommends how taxes are shared. Grants-in-aid (Arts. 275 and 282) help poorer States, and the GST Council (Art. 279A) coordinates indirect tax. Judicial view: State of West Bengal v. Union of India (1963) stressed the strong Centre; State of Rajasthan v. Union of India (1977) upheld Union power within constitutional limits; S.R. Bommai (1994) held federalism to be a basic feature, so Union power must be used sparingly.","The Centre collects more and the Finance Commission corrects the balance.","Conclude with “cooperative federalism”."]]},
{id:"pa",d:1,m:[["A Money Bill can be introduced only in:",["Rajya Sabha","Lok Sabha","Either House","Joint sitting"],1,"Art. 109 and Art. 110: only in the Lok Sabha, on the President’s recommendation."],["The Rajya Sabha must return a Money Bill within:",["7 days","14 days","30 days","3 months"],1,"After 14 days it is deemed passed by both Houses."],["Disqualification under the Tenth Schedule is decided by:",["The Election Commission","The Supreme Court directly","The Speaker or Chairman","The President"],2,"Kihoto Hollohan (1992) held the decision is subject to judicial review."]],t:"Parliament",q:"Composition, joint sitting, ordinary and money bill, privileges, Tenth Schedule, State legislature.",p:[
["1. What is Parliament and how is it composed? (Arts. 79 to 84)","Parliament consists of the President, the Council of States (Rajya Sabha) and the House of the People (Lok Sabha). Rajya Sabha: maximum 250 members, of whom up to 238 represent States and Union Territories (indirectly elected by MLAs through the single transferable vote) and 12 are nominated by the President for expertise in literature, science, art and social service. It is a permanent House: it is never dissolved, one-third retire every second year, and the term is six years. Minimum age 30. Lok Sabha: maximum 550 members, directly elected by adult suffrage from territorial constituencies, with reserved seats for Scheduled Castes and Scheduled Tribes. The term is five years. Minimum age 25. The 106th Amendment (2023) provides one-third reservation for women from the next delimitation.","Lok Sabha is the people’s House, Rajya Sabha is the States’ House and a permanent one.","Give maximum strength, mode of election, term and age for both Houses."],
["2. Sessions, prorogation and dissolution (Art. 85)","The President summons each House, and there can be no gap of more than six months between two sessions, so Parliament meets at least twice a year. Adjournment suspends a sitting and is done by the presiding officer. Prorogation ends a session and is done by the President. Dissolution ends the life of a Lok Sabha (only the President can do it); the Rajya Sabha is never dissolved. A Bill pending in the Lok Sabha lapses on dissolution, but a Bill pending in the Rajya Sabha does not.","Adjourn is a break, prorogue is the end of the session, dissolve is the end of the Lok Sabha.","Use these three terms in a short answer on summoning, prorogation and dissolution."],
["3. How an ordinary Bill becomes law, and the joint sitting (Arts. 107 and 108)","An ordinary Bill can start in either House. First reading: introduction. Second reading: general discussion and then clause-by-clause study, usually in a committee, followed by the report stage. Third reading: vote on the Bill as a whole. It then goes to the other House, which goes through the same stages. Finally the President gives assent (Art. 111). If the Houses disagree, the President may summon a joint sitting (Art. 108) when one House rejects the Bill, the Houses finally disagree on amendments, or six months pass without action by the other House. The Speaker presides and a majority of members present and voting decides. As the Lok Sabha is larger, it usually prevails. Not available for money Bills or constitutional amendments. Only three joint sittings have been held: 1961 (Dowry Prohibition), 1978 (Banking Service Commission Repeal) and 2002 (POTA).","The joint sitting is the tie-breaker, and the bigger House normally wins it.","Draw the Bill’s journey as five numbered steps."],
["4. Money Bill, Financial Bill and the Budget (Arts. 109, 110, 112 to 117)","A Money Bill (Art. 110) deals only with matters such as taxes, borrowing, the Consolidated Fund, appropriation and expenditure charged on it. The Speaker certifies it as a Money Bill and his decision is final. It can be introduced only in the Lok Sabha and on the President’s recommendation. After the Lok Sabha passes it, the Rajya Sabha can only make recommendations within 14 days; the Lok Sabha may accept or reject them, and if the Rajya Sabha does nothing in 14 days the Bill is deemed passed. There is no joint sitting. A Financial Bill (Art. 117) contains money provisions along with other matters, so the Rajya Sabha has wider powers over it. The Budget goes through the Annual Financial Statement, demands for grants, the Appropriation Bill and the Finance Bill; the Rajya Sabha can discuss but not vote on demands for grants.","The Lok Sabha holds the purse. The Rajya Sabha can only advise.","Give five numbered steps for “How is a Money Bill passed?”"],
["5. Parliamentary privileges (Art. 105; Art. 194 for States)","Privileges are special rights that let members work without fear or interference. Individual privileges: freedom of speech in Parliament (Art. 105(1)); no liability in any court for anything said or any vote given in Parliament or its committees (Art. 105(2)); freedom from arrest in civil cases during a session and 40 days before and after it (not in criminal cases or preventive detention); exemption from jury service. Collective privileges: to publish proceedings, to exclude strangers, to regulate its own procedure, and to punish for breach of privilege and contempt. Parliament has not codified them. Cases: M.S.M. Sharma (1959); Keshav Singh (1965), courts can examine mala fide committals; P.V. Narasimha Rao (1998), immunity covered a vote, overruled by Sita Soren (2024), which held that taking a bribe for a vote is not protected; Raja Ram Pal (2007), limited judicial review of privilege.","Privilege is a shield for doing the job, not a licence to break the law.","Separate individual and collective privileges and cite Keshav Singh."],
["6. Disqualification and the Tenth Schedule (Arts. 102 and 191)","Disqualifications include holding an office of profit, unsound mind declared by a court, being an undischarged insolvent, and not being a citizen. Lily Thomas (2013): a member convicted and sentenced to two or more years is disqualified immediately. The Tenth Schedule, added by the 52nd Amendment (1985), is the anti-defection law. A member is disqualified if he voluntarily gives up membership of his party, or votes or abstains against the party whip without permission and without condonation within 15 days. An independent member who joins a party, or a nominated member who joins a party after six months, is also disqualified. A merger is protected if two-thirds of the legislature party agree. The 91st Amendment (2003) removed the old one-third split exception and capped the Council of Ministers at 15 percent. The Speaker decides, but Kihoto Hollohan (1992) held the decision is subject to judicial review.","Anti-defection protects voters’ mandate from being sold between elections.","Mention Kihoto Hollohan and the 91st Amendment."],
["7. The State Legislature (Arts. 168 to 177)","The State Legislature has the Governor, the Legislative Assembly and, in some States, a Legislative Council. Assembly (Art. 170): 60 to 500 members (some small States have fewer), directly elected, term five years, minimum age 25. Council (Art. 171): at most one-third of the Assembly and at least 40 members; it is permanent, with six-year terms and one-third retiring every two years; minimum age 30. Composition: one-third by local authorities, one-third by Assembly members, one-twelfth by graduates, one-twelfth by teachers, one-sixth nominated by the Governor. A Council can be created or abolished by Parliament on a resolution of the Assembly (Art. 169). Rajasthan has only an Assembly. The Council has a weak role: it can delay an ordinary Bill by three months the first time and one month the second time, and money Bills originate only in the Assembly.","The Council is a reviewing chamber, not a rival to the Assembly.","Present the Council’s composition as a list of fractions."]]},
{id:"sh",d:1,m:[["The Council of Ministers cannot exceed what share of the Lok Sabha?",["10 percent","15 percent","20 percent","25 percent"],1,"Art. 75(1A), inserted by the 91st Amendment."],["The Attorney General can in Parliament:",["Vote","Speak but not vote","Move Bills","Chair a committee"],1,"Art. 88 gives a right to speak and take part, without a vote."],["The Vice-President can act as President for up to:",["3 months","6 months","1 year","Until the next election"],1,"Art. 65 covers vacancies and the President’s inability to function."]],t:"Short notes",q:"Part A: Council of Ministers, Prime Minister, Vice-President, Attorney General.",p:[
["1. The Council of Ministers (Arts. 74 and 75)","The Council is the real executive of the Union. The Prime Minister is appointed by the President, and the other ministers are appointed on the Prime Minister’s advice (Art. 75(1)). It has three ranks: Cabinet Ministers, Ministers of State and Deputy Ministers. Since the 91st Amendment its total size cannot exceed 15 percent of the Lok Sabha (Art. 75(1A)). Ministers hold office during the pleasure of the President, and a minister who is not a member of Parliament must become one within six months (Art. 75(5)). The Council aids and advises the President, frames policy, introduces Bills and runs the departments of government.","The Council is the engine of government. The President is the badge on the bonnet.","Write composition, size limit and functions as three short headings."],
["2. Collective responsibility (Art. 75(3))","The Council is collectively responsible to the Lok Sabha. This means all ministers sink or swim together. A Cabinet decision binds every minister; a minister who disagrees must either defend it in public or resign. If the Lok Sabha passes a vote of no confidence against the government, the entire Council must resign, not just one minister. Individual responsibility is different: each minister answers for his own department and holds office at the President’s pleasure (Art. 75(2)). This principle is the heart of parliamentary government.","It is like a cricket team: when the captain’s side loses the match, the whole team loses, not just the bowler.","Always add the consequence: a vote of no confidence removes the whole ministry."],
["3. The Prime Minister’s position (Arts. 74, 75 and 78)","The Prime Minister heads the Council and is described as first among equals and the keystone of the Cabinet arch. He is appointed by the President, usually as leader of the majority in the Lok Sabha. Ministers are chosen and dropped on his advice, and when he resigns or dies, the whole Council goes. Art. 78 makes him the link between the President and the Council: he must communicate all Cabinet decisions on administration and legislation to the President and supply information the President asks for. He also leads the Lok Sabha, presides over the Cabinet, and is the national face abroad. In practice his strength depends on his party’s majority and personal authority.","If the Council is an arch, the Prime Minister is the central stone that holds it up.","Give four points of his position and Art. 78."],
["4. The Vice-President (Arts. 63 to 71)","The Vice-President is the second highest constitutional office. He is elected by an electoral college of all members of both Houses of Parliament (elected and nominated) under proportional representation by single transferable vote, by secret ballot (Art. 66). Qualifications: a citizen, at least 35 years old, qualified for election to the Rajya Sabha, and holding no office of profit. The term is five years (Art. 67). He can resign to the President, and can be removed by a resolution of the Rajya Sabha passed by a majority of all its members and agreed to by the Lok Sabha, after 14 days’ notice. He is the ex officio Chairman of the Rajya Sabha (Art. 89) and acts as President when the office falls vacant or the President is unable to work, up to six months (Art. 65). Election disputes go to the Supreme Court (Art. 71).","He has two roles: presiding officer of the Rajya Sabha and standby President.","Mention both roles. Many students forget the second."],
["5. The Attorney General for India (Art. 76)","The Attorney General is the Government of India’s chief legal officer. He is appointed by the President and must be qualified to be a Supreme Court judge. He holds office during the pleasure of the President, and his remuneration is fixed by the President. Duties: advising the Government on legal matters, appearing for it in the Supreme Court and High Courts, and performing other legal duties assigned to him. Rights: he can speak and take part in the proceedings of both Houses and their committees, but cannot vote (Art. 88). He is not a full-time government servant, can practise privately, but cannot advise or appear against the Government of India. The State equivalent is the Advocate General (Art. 165).","He is the government’s lawyer in court and its legal adviser in Parliament.","The point to remember: right to speak in Parliament but no vote."]]}
];
var C=[["Kesavananda Bharati (1973)","Parliament can amend anything but not the basic structure."],["Minerva Mills (1980)","Limited amending power is basic structure. Emergency review on limited grounds."],["Golak Nath (1967)","Parliament cannot amend Fundamental Rights. Overruled."],["S.R. Bommai (1994)","Art. 356 reviewable, floor test, secularism and federalism basic."],["Shamsher Singh (1974)","President and Governor act on ministerial advice."],["Ram Jawaya Kapur (1955)","President is a constitutional head."],["D.C. Wadhwa (1987)","Re-promulgating ordinances is a fraud on the Constitution."],["Advocates-on-Record (1993, 2015)","Collegium created. NJAC struck down."],["L. Chandra Kumar (1997)","Review under Arts. 32 and 226 is basic structure."],["I.R. Coelho (2007)","Ninth Schedule laws are open to review."],["Kihoto Hollohan (1992)","Tenth Schedule valid. Speaker’s decision reviewable."],["Keshav Singh (1965)","Limits of privilege; High Court can examine contempt committals."],["Maneka Gandhi (1978)","Art. 21 procedure must be fair, just and reasonable."],["ADM Jabalpur (1976)","No habeas corpus in emergency. Declared wrong in Puttaswamy (2017)."],["M.C. Mehta (1987)","Absolute liability, wide remedies under Art. 32."]];
